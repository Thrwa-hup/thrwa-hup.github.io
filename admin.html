<style>
  :root {
    --navy: #292F69; --navy-deep: #202658; --navy-2: #303779;
    --tq: #48B9CB; --tq-soft: #E4F5F8; --or: #F09520; --or-soft: #FDF0DD;
    --mint: #B5DFDA; --peach: #F3D9B8; --mustard: #F3BE5E; --green: #8CC08F;
    --bg: #F5F6FB; --card: #FFFFFF; --line: #E2E5F1; --text: #292F69; --muted: #6B6F99;
    --ok: #2E9E6A; --ok-soft: #E3F5EC; --warn: #B76E00; --warn-soft: #FFF3DC; --bad: #C8463D; --bad-soft: #FDE8E6;
    --radius: 18px; --shadow: 0 6px 24px rgba(41, 47, 105, .08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Times New Roman', 'Amiri', Times, serif; font-size: 17px; line-height: 1.85; direction: rtl; -webkit-font-smoothing: antialiased; }

  b, strong { font-weight: 600; }
  h1, h2, h3, .sec-title, .btn.big { font-family: 'Times New Roman', 'Amiri', Times, serif; font-weight: 700; letter-spacing: 0; line-height: 1.6; }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* ===== الترويسة بهوية الشعار ===== */
  .hero { position: relative; overflow: hidden; color: #fff; background: linear-gradient(180deg, var(--navy-deep) 0%, var(--navy-2) 100%); }
  .hero .sky { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .hero-inner { position: relative; max-width: 1100px; margin: 0 auto; padding: 34px 20px 26px; display: flex; align-items: center; gap: 26px; }
  .hero-logo { height: 150px; width: auto; flex: none; filter: drop-shadow(0 6px 18px rgba(0,0,0,.18)); }
  .hero h1 { font-family: 'DecoType Thuluth II', 'DecoType Thuluth', 'Aref Ruqaa', serif; font-weight: 400; font-size: clamp(40px, 7vw, 64px); line-height: 1.25; margin: 0 0 4px; letter-spacing: 0; }
  .hero p { margin: 0; color: #CFE9EE; font-weight: 300; max-width: 560px; }
  .hero .pill { font-family: 'DecoType Thuluth II', 'DecoType Thuluth', 'Aref Ruqaa', serif; font-size: 17px !important; display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; background: var(--or); color: var(--navy); font-weight: 500; font-size: 13px; padding: 4px 14px; border-radius: 99px; }
  .strip { display: flex; justify-content: center; gap: 16px; padding: 14px 0 12px; position: relative; }
  .strip svg { width: 15px; height: 15px; flex: none; }
  @media (max-width: 640px) {
    .hero-inner { flex-direction: column; text-align: center; padding-top: 26px; gap: 14px; }
    .hero-logo { height: 104px; }
    .strip { gap: 10px; }
    .hero .sky { opacity: .55; }
  }

  /* ===== عناصر عامة ===== */
  .wrap { max-width: 780px; margin: 0 auto; padding: 0 16px 60px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; margin-top: 18px; }
  .sec-title { display: inline-flex; align-items: center; gap: 10px; background: var(--navy); color: #fff; font-weight: 500; font-size: 16px; padding: 6px 18px 6px 26px; margin: 0 0 16px; clip-path: polygon(0 0, 100% 0, 100% 100%, 14px 100%); border-radius: 0; }
  .sec-title svg { width: 14px; height: 14px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  label.f { display: block; font-weight: 500; margin: 14px 0 6px; }
  label.f .req { color: var(--or); }
  .hint { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .in, select.in, textarea.in { width: 100%; background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 14px; outline: none; transition: border-color .15s, box-shadow .15s; }
  .in:focus { border-color: var(--tq); box-shadow: 0 0 0 4px rgba(72, 185, 203, .18); }
  textarea.in { min-height: 150px; resize: vertical; line-height: 1.8; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  @media (max-width: 640px) { .row2 { grid-template-columns: 1fr; } }
  input[type=tel], .ltr { direction: ltr; text-align: right; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer; border-radius: 12px; padding: 10px 18px; font-weight: 500; background: var(--tq-soft); color: var(--navy); text-decoration: none; transition: transform .08s, filter .15s; white-space: nowrap; }
  .btn:hover { filter: brightness(.97); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.primary { background: var(--navy); color: #fff; }
  .btn.accent { background: var(--or); color: var(--navy); }
  .btn.ok { background: var(--ok); color: #fff; }
  .btn.bad { background: var(--bad-soft); color: var(--bad); }
  .btn.ghost { background: transparent; border: 1.5px solid var(--line); }
  .btn.sm { padding: 6px 12px; font-size: 13px; border-radius: 10px; }
  .btn.big { width: 100%; padding: 15px; font-size: 17px; border-radius: 14px; }
  .btn svg { width: 17px; height: 17px; flex: none; }

  .note { display: flex; gap: 12px; align-items: flex-start; border-radius: 14px; padding: 12px 16px; font-size: 14px; }
  .note svg { width: 20px; height: 20px; flex: none; margin-top: 2px; }
  .note.or { background: var(--or-soft); border: 1.5px dashed var(--or); color: var(--navy); }
  .note.tq { background: var(--tq-soft); }
  .note.bad { background: var(--bad-soft); color: var(--bad); }
  .note.ok { background: var(--ok-soft); color: #1d6b47; }

  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 500; padding: 2px 11px; border-radius: 99px; background: var(--tq-soft); color: var(--navy); white-space: nowrap; }
  .badge.ok { background: var(--ok-soft); color: #1d6b47; }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.bad { background: var(--bad-soft); color: var(--bad); }
  .badge.navy { background: var(--navy); color: #fff; }
  .badge.or { background: var(--or-soft); color: #8a4f00; }
  .badge.gray { background: #EEF0F6; color: var(--muted); }

  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(30px); opacity: 0; background: var(--navy); color: #fff; padding: 11px 20px; border-radius: 12px; box-shadow: var(--shadow); transition: all .25s; z-index: 99; max-width: calc(100% - 32px); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { background: var(--bad); }

  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--tq), var(--or)); transition: width .2s; }
  .spin { width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
  .footer { text-align: center; color: var(--muted); font-size: 13px; padding: 30px 16px 40px; }
  .footer a { color: var(--muted); }
</style>

  <style>

    .stat.or b { color: var(--or); } .stat.bad b { color: var(--bad); } .stat.ok b { color: var(--ok); } .stat.tq b { color: var(--tq); }

    .tabs button { border: 0; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 9px 15px; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; font-weight: 500; white-space: nowrap; color: var(--navy); }
    .tabs button svg { width: 17px; height: 17px; }
    .tabs button.on { background: var(--navy); color: #fff; border-color: var(--navy); }

    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }

    .req .pv { width: 64px; height: 80px; border-radius: 12px; background: #EEF0F6 center/cover no-repeat; display: grid; place-items: center; color: var(--navy); flex: none; position: relative; }
    .req .pv svg { width: 26px; height: 26px; }
    .req .pv .n { position: absolute; bottom: -6px; left: -6px; background: var(--navy); color: #fff; font-size: 11px; border-radius: 99px; padding: 0 7px; border: 2px solid #fff; }
    .req h3 { margin: 0; font-size: 16px; font-weight: 500; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .req .id { direction: ltr; font-weight: 600; color: var(--muted); font-size: 13px; }

    .pchip svg { width: 12px; height: 12px; }
    .pchip.done { background: var(--ok-soft); color: #1d6b47; } .pchip.error { background: var(--bad-soft); color: var(--bad); } .pchip.manual { background: var(--or-soft); color: #8a4f00; }
    .req .side { text-align: left; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
    .req .body { border-top: 1px solid var(--line); padding: 16px; display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; }
    @media (max-width: 860px) { .req .body { grid-template-columns: 1fr; } .req > summary { grid-template-columns: auto 1fr; } .req .side { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; align-items: center; } }
    .gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; margin-bottom: 10px; }
    .gal a { display: block; aspect-ratio: 4/5; border-radius: 10px; background: #EEF0F6 center/cover no-repeat; position: relative; color: var(--navy); }
    .gal a .t { position: absolute; inset: auto 0 0 0; font-size: 10.5px; background: rgba(32,38,88,.78); color: #fff; padding: 2px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: ltr; }
    .gal a .ic { position: absolute; inset: 0; display: grid; place-items: center; } .gal a .ic svg { width: 26px; height: 26px; }
    .gal a .x { position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 50%; background: rgba(32,38,88,.85); color: #fff; display: grid; place-items: center; border: 0; cursor: pointer; }

    .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13.5px; margin-bottom: 10px; }

    .checks { list-style: none; padding: 0; margin: 0 0 10px; font-size: 13.5px; }
    .checks li { padding: 6px 10px; border-radius: 10px; background: #F6F7FB; margin-bottom: 5px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .plat-res { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; font-size: 13.5px; }
    .plat-res .hd { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .plat-res .man { display: flex; gap: 6px; margin-top: 8px; }
    .plat-res .man .in { padding: 6px 10px; font-size: 13px; }
    .pl-sel { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
    .pl-sel label { font-size: 13px; border: 1.5px solid var(--line); border-radius: 10px; padding: 3px 10px; cursor: pointer; display: flex; gap: 5px; align-items: center; }

          return '<div class="plat-res"><div class="hd"><b>' + E(x.id) + ' — ' + E(x.program || '') + '</b><span class="badge or">' + E(TH.date(x.desired)) + '</span></div>' +

    function reqCard(r) {
      var img = (r.files || []).filter(function (f) { return /^(image|video)\//.test(f.mime); })[0];
      var pv = img ? ' style="background-image:url(' + thumbUrl(img.id, 200) + ')"' : '';
      var chips = r.platforms.map(function (k) {
        var s = pState(r, k).state || '';
        var ic = s === 'done' ? I('check') : s === 'error' ? I('alert') : s === 'manual' ? I('edit') : s === 'confirm' ? I('send') : s === 'processing' ? I('refresh') : I('clock');
        return '<span class="pchip ' + (s === 'confirm' ? 'manual' : s) + '">' + ic + (PN[k] || k) + '</span>';
      }).join('');
      var open = r._open ? ' open' : '';
      return '<details class="req" data-id="' + E(r.id) + '"' + open + ' ontoggle="toggled(this)"><summary><div class="pv"' + pv + '>' + (img ? '' : I('pdf')) + (r.files.length > 1 ? '<span class="n">' + r.files.length + '</span>' : '') + '</div>' +
        '<div><h3><span class="id">' + E(r.id) + '</span>' + E(r.program || 'بدون برنامج') + ' <span class="muted small" style="font-weight:400">— ' + E(r.name) + '</span></h3>' +
        '<div class="sub">' + I('calendar').replace('<svg', '<svg width="13" height="13" style="vertical-align:-2px"') + ' موعد النشر: ' + E(TH.date(r.desired)) + '</div>' +
        '<div class="txt">' + E(r.text) + '</div><div class="pchips">' + chips + '</div></div>' +
        '<div class="side"><span class="badge ' + (ST_CLS[r.status] || '') + '">' + E(r.status) + '</span><span class="muted small">وصل ' + E(TH.date(r.created, false)) + '</span></div></summary>' +
        reqBody(r) + '</details>';
    }
    window.toggled = function (d) { var r = findReq(d.dataset.id); if (r) r._open = d.open; };
    function findReq(id) { return D.requests.filter(function (x) { return x.id === id; })[0]; }

    function reqBody(r) {
      var gal = (r.files || []).map(function (f) {
        var isImg = /^image\//.test(f.mime), isVid = /^video\//.test(f.mime);
        return '<a href="' + viewUrl(f.id) + '" target="_blank" rel="noopener" style="' + (isImg || isVid ? 'background-image:url(' + thumbUrl(f.id, 300) + ')' : '') + '">' +
          (isImg ? '' : '<span class="ic">' + I(isVid ? 'play' : 'pdf') + '</span>') + '<span class="t">' + E(f.name) + (f.w ? ' · ' + f.w + '×' + f.h : '') + '</span>' +
          '<button class="x" title="إزالة من الطلب" data-act="rmfile" data-id="' + E(r.id) + '" data-f="' + E(f.id) + '">' + I('x') + '</button></a>';
      }).join('');
      var checks = String(r.check || '').split('\n').filter(String).map(function (c) { return '<li>' + E(c) + '</li>'; }).join('');
      var plats = D.allPlatforms.map(function (p) {
        return '<label><input type="checkbox" value="' + p.key + '"' + (r.platforms.indexOf(p.key) >= 0 ? ' checked' : '') + '>' + E(p.name) + '</label>';
      }).join('');
      var res = r.platforms.map(function (k) {
        var s = pState(r, k), stt = s.state === 'done' ? '<span class="badge ok">منشور</span>' : s.state === 'error' ? '<span class="badge bad">فشل' + (s.attempts ? ' (' + s.attempts + ')' : '') + '</span>' :
          s.state === 'manual' ? '<span class="badge or">بانتظار نشر يدوي</span>' : s.state === 'confirm' ? '<span class="badge or">بانتظار تأكيدك</span>' :
          s.state === 'processing' ? '<span class="badge navy">قيد المعالجة</span>' : '<span class="badge gray">لم يُنشر بعد</span>';
        var body = '';
        if (s.link) body += '<div style="margin-top:6px"><a href="' + E(s.link) + '" target="_blank" rel="noopener">' + I('link').replace('<svg', '<svg width="14" height="14" style="vertical-align:-2px"') + ' فتح المنشور</a>' + (s.at ? ' <span class="muted small">· ' + E(TH.date(s.at)) + '</span>' : '') + '</div>';
        if (s.error) body += '<div class="small" style="color:var(--bad);margin-top:6px">' + E(s.error) + '</div>';
        if (s.note) body += '<div class="small muted" style="margin-top:6px">' + E(s.note) + '</div>';
        if (k === 'tiktok' && s.state !== 'done' && s.state !== 'processing' && tiktokConnected()) body += '<div class="actions" style="margin-top:8px"><button class="btn sm primary" data-act="ttconfirm" data-id="' + E(r.id) + '">' + I('send') + 'نشر في تيك توك</button></div>';
        if (s.state === 'manual' || s.state === 'error') body += '<div class="man"><input class="in" placeholder="رابط المنشور بعد نشره بنفسك (اختياري)" data-link="' + k + '"><button class="btn sm ok" data-act="manual" data-id="' + E(r.id) + '" data-p="' + k + '">' + I('check') + 'نشرته بنفسي</button></div>';
        return '<div class="plat-res"><div class="hd"><b>' + (PN[k] || k) + '</b>' + stt + '</div>' + body + '</div>';
      }).join('');
      var lib = D.media.length ? '<select class="in" data-lib="' + E(r.id) + '" style="margin-top:6px"><option value="">+ إرفاق مقطع أو صورة من المكتبة…</option>' + D.media.map(function (m) {
        return '<option value="' + E(m.id) + '">' + E((m.program ? m.program + ' — ' : '') + m.name) + '</option>';
      }).join('') + '</select>' : '';
      var canPublish = ['مقبول', 'فشل النشر', 'بانتظار نشر يدوي'].indexOf(r.status) >= 0;
      return '<div class="body"><div>' +
        '<div class="gal">' + (gal || '<div class="muted small">لا توجد ملفات.</div>') + '</div>' + lib +
        '<label class="f">نص المنشور</label><textarea class="in" data-text="' + E(r.id) + '" style="min-height:130px">' + E(r.text) + '</textarea>' +
        '<label class="f">المنصات</label><div class="pl-sel" data-plats="' + E(r.id) + '">' + plats + '</div>' +
        '<label class="f">موعد النشر</label><input class="in ltr" type="datetime-local" data-desired="' + E(r.id) + '" value="' + localInput(r.desired) + '">' +
        '<div class="actions"><button class="btn sm" data-act="save" data-id="' + E(r.id) + '">' + I('edit') + 'حفظ التعديلات وإعادة الفحص</button></div>' +
        '</div><div>' +
        '<dl class="kv"><dt>صاحب الطلب</dt><dd>' + E(r.name) + '</dd><dt>الجوال</dt><dd><a class="ltr" href="tel:' + E(r.phone) + '">' + E(r.phone) + '</a> · <a href="https://wa.me/966' + E(String(r.phone).replace(/^0/, '')) + '" target="_blank" rel="noopener">واتساب</a></dd>' +
        '<dt>البرنامج</dt><dd>' + E(r.program || '—') + '</dd><dt>فيه أشخاص</dt><dd>' + E(r.people) + (r.people === 'نعم' ? ' — الموافقة: ' + E(r.consent) : '') + '</dd>' +
        '<dt>وصل</dt><dd>' + E(TH.date(r.created)) + '</dd>' + (r.publishedAt ? '<dt>نُشر</dt><dd>' + E(TH.date(r.publishedAt)) + '</dd>' : '') + '</dl>' +
        '<b class="small">نتيجة الفحص الآلي</b><ul class="checks">' + (checks || '<li>—</li>') + '</ul>' +
        '<b class="small">النشر في المنصات</b><div style="margin-top:6px">' + res + '</div>' +
        '<label class="f">ملاحظة المراجعة (تظهر لك فقط)</label><input class="in" data-note="' + E(r.id) + '" value="' + E(r.review || '') + '" placeholder="مثال: اعتمده المشرف الشرعي">' +
        '<div class="actions">' +
        (r.status !== 'منشور' ? '<button class="btn sm ok" data-act="approve" data-id="' + E(r.id) + '">' + I('check') + 'اعتماد</button>' : '') +
        (canPublish ? '<button class="btn sm primary" data-act="publish" data-id="' + E(r.id) + '">' + I('send') + 'انشر الآن</button>' : '') +
        (r.status !== 'مرفوض' && r.status !== 'منشور' ? '<button class="btn sm bad" data-act="reject" data-id="' + E(r.id) + '">' + I('x') + 'رفض</button>' : '') +
        (r.status !== 'مؤرشف' ? '<button class="btn sm ghost" data-act="archive" data-id="' + E(r.id) + '">' + I('archive') + 'أرشفة</button>' : '') +
        '</div></div></div>';
    }

    function replaceReq(r) {
      var old = findReq(r.id); r._open = true;
      D.requests = D.requests.map(function (x) { return x.id === r.id ? r : x; });
      D.stats = {}; D.requests.forEach(function (x) { D.stats[x.status] = (D.stats[x.status] || 0) + 1; });
      renderRequests();
    }

    function act(b) {
      var id = b.dataset.id, a = b.dataset.act, note = (document.querySelector('[data-note="' + id + '"]') || {}).value;
      if (a === 'approve') call(b, 'adminSetStatus', id, 'مقبول', note).then(function (r) { TH.toast('اعتُمد الطلب، وسيُنشر في موعده'); replaceReq(r); });
      if (a === 'reject') {
        var why = prompt('سبب الرفض (يظهر في ملاحظة المراجعة):', note || '');
        if (why === null) return;
        call(b, 'adminSetStatus', id, 'مرفوض', why).then(function (r) { TH.toast('رُفض الطلب. تواصل مع صاحبه على جواله.'); replaceReq(r); });
      }
      if (a === 'archive') call(b, 'adminSetStatus', id, 'مؤرشف', note).then(function (r) { TH.toast('أُرشف الطلب'); replaceReq(r); });
      if (a === 'publish') {
        if (!confirm('نشر الطلب ' + id + ' الآن في المنصات المختارة؟')) return;
        call(b, 'adminPublishNow', id).then(function (r) { TH.toast('الحالة: ' + r.status); replaceReq(r); load(true); });
      }
      if (a === 'manual') {
        if (!confirm('هذا الزر يسجّل إنك نشرته بنفسك، والمنصة ما راح تنشره. متأكد؟')) return;
        var inp = b.closest('.plat-res').querySelector('[data-link]'), link = inp ? inp.value.trim() : '';
        call(b, 'adminMarkManual', id, b.dataset.p, link).then(function (r) { TH.toast('تم تسجيل النشر'); replaceReq(r); });
      }
      if (a === 'save') {
        var plats = Array.prototype.map.call(document.querySelectorAll('[data-plats="' + id + '"] input:checked'), function (i) { return i.value; });
        if (!plats.length) return TH.toast('اختر منصة واحدة على الأقل', true);
        call(b, 'adminUpdateRequest', id, { text: document.querySelector('[data-text="' + id + '"]').value, platforms: plats,
          desired: document.querySelector('[data-desired="' + id + '"]').value }).then(function (r) { TH.toast('حُفظ وأعيد الفحص: ' + r.status); replaceReq(r); });
      }
      if (a === 'ttconfirm') return tiktokDialog(findReq(id));
      if (a === 'wacopy') {
        var w = (D.whatsappQueue || []).filter(function (x) { return x.id === id; })[0];
        if (w) navigator.clipboard.writeText(w.caption).then(function () { TH.toast('نُسخ النص'); }, function () { prompt('انسخ النص:', w.caption); });
        return;
      }
      if (a === 'wadone') {
        return call(b, 'adminMarkManual', id, 'whatsapp', '').then(function (r) {
          D.whatsappQueue = (D.whatsappQueue || []).filter(function (x) { return x.id !== id; });
          TH.toast('سُجّل النشر'); replaceReq(r); renderRequests();
        });
      }
      if (a === 'ttcopy') {
        var it = (D.tiktokQueue || []).filter(function (x) { return x.id === id; })[0];
        if (it) navigator.clipboard.writeText(it.caption).then(function () { TH.toast('نُسخ النص'); }, function () { prompt('انسخ النص:', it.caption); });
        return;
      }
      if (a === 'ttsched') {
        return call(b, 'adminMarkManual', id, 'tiktok', '').then(function (r) {
          D.tiktokQueue = (D.tiktokQueue || []).filter(function (x) { return x.id !== id; });
          TH.toast('سُجّلت الجدولة'); replaceReq(r); renderRequests();
        });
      }
      if (a === 'rmfile') {
        var r0 = findReq(id);
        if (!confirm('إزالة الملف من هذا الطلب؟ (يبقى الملف في درايف)')) return;
        call(b, 'adminUpdateRequest', id, { files: r0.files.filter(function (f) { return f.id !== b.dataset.f; }) }).then(replaceReq);
      }
    }
    document.addEventListener('change', function (e) {
      var s = e.target.closest('[data-lib]');
      if (!s || !s.value) return;
      var id = s.dataset.lib; s.disabled = true;
      TH.run('adminUpdateRequest', KEY, id, { addMediaId: s.value }).then(function (r) { TH.toast('أُرفق الملف وأعيد الفحص'); replaceReq(r); }, function (er) { s.disabled = false; TH.toast(er.message, true); });
    });

    function tiktokConnected() { var t = D.platforms.list.filter(function (p) { return p.key === 'tiktok'; })[0]; return t && t.connected; }

    // نافذة النشر في تيك توك — مطابقة لشروط تيك توك (اسم الحساب، خصوصية بدون اختيار افتراضي، تفاعلات غير مفعّلة افتراضيًا، معاينة، إقرار)
    function tiktokDialog(r) {
      var v = (r.files || []).filter(function (f) { return /^video\//.test(f.mime); })[0];
      if (!v) return TH.toast('تيك توك يقبل فيديو فقط. أرفق مقطعًا من المكتبة أولًا.', true);
      var m = document.createElement('div'); m.className = 'modal';
      m.innerHTML = '<div class="mbox"><div class="loading" style="padding:40px 0"><div class="spin"></div>جارٍ جلب معلومات حساب تيك توك…</div></div>';
      document.body.appendChild(m);
      m.onclick = function (e) { if (e.target === m) m.remove(); };
      TH.run('adminTikTokCreatorInfo', KEY).then(function (ci) {
        var PL = { PUBLIC_TO_EVERYONE: 'الجميع', MUTUAL_FOLLOW_FRIENDS: 'الأصدقاء', FOLLOWER_OF_CREATOR: 'المتابعون', SELF_ONLY: 'أنا فقط' };
        var tg = function (id, label, dis) { return '<label class="tt-tg' + (dis ? ' dis' : '') + '"><input type="checkbox" id="' + id + '"' + (dis ? ' disabled' : '') + '> ' + label + (dis ? ' <span class="muted small">(معطّل في إعدادات الحساب)</span>' : '') + '</label>'; };
        m.querySelector('.mbox').innerHTML = '<h3 style="margin:0 0 4px">النشر في تيك توك</h3><div class="muted small">الحساب: <b>' + E(ci.nickname || ci.username) + '</b>' + (ci.username ? ' <span class="ltr">@' + E(ci.username) + '</span>' : '') + '</div>' +
          '<div class="tt-grid"><div class="tt-pv"><a href="' + viewUrl(v.id) + '" target="_blank" rel="noopener" style="background-image:url(' + thumbUrl(v.id, 400) + ')"><span class="play">' + I('play') + '</span></a><div class="small muted" style="margin-top:4px">معاينة المقطع</div></div><div>' +
          '<label class="f" style="margin-top:0">العنوان والوسوم</label><textarea class="in" id="ttTitle" style="min-height:110px">' + E(r.text) + '</textarea>' +
          '<label class="f">من يشاهد المقطع؟ · Who can view</label><select class="in" id="ttPriv"><option value="">— اختر —</option>' + ci.privacy.map(function (p) { return '<option value="' + p + '">' + (PL[p] || p) + '</option>'; }).join('') + '</select>' +
          '<label class="f">السماح للمستخدمين بـ · Allow users to</label><div class="tt-tgs">' + tg('ttCom', 'التعليق · Comment', ci.commentDisabled) + tg('ttDuet', 'الدويتو · Duet', ci.duetDisabled) + tg('ttSt', 'الستيتش · Stitch', ci.stitchDisabled) + '</div>' +
          '<div class="hint">اللوائح: تعطيل الدويتو والستيتش.</div></div></div>' +
          '<div class="tt-cc"><label class="tt-tg"><input type="checkbox" id="ttCC"> الإفصاح عن محتوى تجاري · Disclose video content</label>' +
          '<div id="ttCCbox" class="hidden" style="margin-top:8px"><div class="tt-tgs">' +
          '<label class="tt-tg"><input type="checkbox" id="ttBrand"> علامتك التجارية · Your brand</label>' +
          '<label class="tt-tg"><input type="checkbox" id="ttBranded"> محتوى مدفوع · Branded content</label></div>' +
          '<div class="hint" id="ttCChint">اختر خيارًا واحدًا على الأقل.</div></div></div>' +
          '<label class="consent" style="margin-top:14px"><input type="checkbox" id="ttOk"><span id="ttOkTxt"></span></label>' +
          '<div class="hint">بعد النشر قد يأخذ تيك توك بضع دقائق لمعالجة المقطع وظهوره في الحساب.</div>' +
          '<div class="actions"><button class="btn primary" id="ttGo">' + I('send') + 'نشر · Post</button><button class="btn ghost" id="ttNo">إلغاء</button></div>';
        m.querySelector('#ttNo').onclick = function () { m.remove(); };
        var MU = '<a href="https://www.tiktok.com/legal/page/global/music-usage-confirmation/en" target="_blank" rel="noopener">Music Usage Confirmation</a>',
          BC = '<a href="https://www.tiktok.com/legal/page/global/bc-policy/en" target="_blank" rel="noopener">Branded Content Policy</a>';
        var ccSync = function () {
          var on = m.querySelector('#ttCC').checked, brand = m.querySelector('#ttBrand').checked, branded = m.querySelector('#ttBranded').checked;
          m.querySelector('#ttCCbox').classList.toggle('hidden', !on);
          var self = m.querySelector('#ttPriv option[value=SELF_ONLY]');

          m.querySelector('#ttCChint').textContent = !on ? '' : branded ? 'سيظهر المقطع بوسم «Paid partnership». لا يمكن جعل المحتوى المدفوع خاصًا.' : brand ? 'سيظهر المقطع بوسم «Promotional content».' : 'اختر خيارًا واحدًا على الأقل.';
          m.querySelector('#ttOkTxt').innerHTML = 'بالنشر، أوافق على ' + (on && branded ? BC + ' و' : '') + MU + ' في تيك توك. · By posting, you agree to TikTok\'s ' + (on && branded ? BC + ' and ' : '') + MU + '.';
        };
        ['#ttCC', '#ttBrand', '#ttBranded'].forEach(function (q) { m.querySelector(q).onchange = ccSync; });
        ccSync();
        m.querySelector('#ttGo').onclick = function () {
          var priv = m.querySelector('#ttPriv').value;
          if (!priv) return TH.toast('اختر من يشاهد المقطع', true);

          var b = this;
          call(b, 'adminTikTokPublish', r.id, { privacy: priv, title: m.querySelector('#ttTitle').value, comment: m.querySelector('#ttCom').checked,
            duet: m.querySelector('#ttDuet').checked, stitch: m.querySelector('#ttSt').checked, consent: true, brand: cc && brand, branded: cc && branded }).then(function (nr) { m.remove(); TH.toast('أُرسل المقطع لتيك توك'); replaceReq(nr); });
        };
      }).catch(function (e) { m.querySelector('.mbox').innerHTML = '<div class="note bad">' + I('alert') + '<div>' + E(e.message) + '</div></div><div class="actions"><button class="btn ghost" onclick="this.closest(\'.modal\').remove()">إغلاق</button></div>'; });
    }

    // ===================== المنصات =====================
    var GUIDE = {

          [['public', 'عام'], ['unlisted', 'غير مدرج'], ['private', 'خاص']].map(function (o) { return '<option value="' + o[0] + '"' + (p.privacy === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></div>' +

    function pmsg(k, ok, html) { var m = document.getElementById('pm-' + k); if (m) m.innerHTML = '<div class="note ' + (ok ? 'ok' : 'bad') + '" style="margin-top:10px">' + I(ok ? 'check' : 'alert') + '<div>' + html + '</div></div>'; }
    function platAct(b) {
      var k = b.dataset.k, a = b.dataset.pa, v = function (id) { var x = document.getElementById(id); return x ? x.value.trim() : ''; };
      var done = function (p) { D.platforms = p; renderPlatforms(); };
      if (a === 'keys') return call(b, 'adminSaveAppKeys', k, v(k + '-id'), v(k + '-sec')).then(function (p) { done(p); pmsg(k, true, 'حُفظت المفاتيح. اضغط «ربط الحساب».'); });
      if (a === 'oauth') {
        var w = window.open('', '_blank');
        return call(b, 'adminOAuthStart', k).then(function (url) {
          if (w) w.location = url; else window.open(url, '_blank');
          pmsg(k, true, 'انفتحت صفحة تسجيل الدخول في نافذة جديدة. سجّل بحساب الجمعية ووافق، ثم ارجع هنا واضغط <a href="#" onclick="load();return false">تحديث</a>.');
        }, function () { if (w) w.close(); });
      }
      if (a === 'off') { if (!confirm('فصل ' + (PN[k] || k) + '؟ الطلبات ستتحول للنشر اليدوي في هذه المنصة.')) return; return call(b, 'adminDisconnect', k).then(done); }
      if (a === 'yt') return call(b, 'adminYouTubeConnect').then(function (p) { done(p); pmsg(k, true, 'انربطت القناة.'); }, function (e) { pmsg(k, false, E(e.message)); });
      if (a === 'wa') return call(b, 'adminSaveWhatsApp', { phoneId: v('waId'), token: v('waTok'), template: v('waTpl'), lang: v('waLang') }).then(function (p) { done(p); pmsg(k, true, 'تم الربط. أضف أرقام الموافقين في ورقة «قائمة واتساب».'); }, function (e) { pmsg(k, false, E(e.message)); });
      if (a === 'igmanual' || a === 'igtest') {
        var go = a === 'igtest' ? call(b, 'adminTestInstagram') : call(b, 'adminSaveInstagram', { userId: v('igId'), token: v('igTok'), host: v('igHost'), version: v('igVer') });
        return go.then(function (r) { D.platforms = r.platforms; renderPlatforms();
          if (r.ok) pmsg('instagram', true, 'تم الربط بحساب <b>@' + E(r.username) + '</b> (' + E(r.mediaCount) + ' منشور).' + (r.quota ? ' المستخدم من حد النشر اليومي: ' + E(r.quota) + '.' : ''));
          else pmsg('instagram', false, E(r.error)); });
      }
    }

        '<a class="btn ghost" href="' + D.links.mediaFolder + '" target="_blank" rel="noopener">' + I('eye') + 'فتح المجلد في درايف</a></div><div class="upq" id="upq"></div></div>' +
        '<div class="mgrid" style="margin-top:14px">' + (D.media.length ? D.media.map(function (m) {
          var vid = /^video\//.test(m.mime);
          return '<div class="mitem"><a class="pv" href="' + viewUrl(m.id) + '" target="_blank" rel="noopener" style="background-image:url(' + thumbUrl(m.id, 400) + ')">' + (vid ? '<span class="play">' + I('play') + '</span>' : '') +
            (m.dur ? '<span class="dur">' + Math.floor(m.dur / 60) + ':' + ('0' + (m.dur % 60)).slice(-2) + '</span>' : '') + '</a>' +
            '<div class="meta"><b>' + E(m.name) + '</b><span class="muted">' + TH.size(m.size) + (m.program ? ' · ' + E(m.program) : '') + '</span>' + (m.note ? '<div class="small">' + E(m.note) + '</div>' : '') + '</div>' +
            '<div class="ops"><button class="btn sm" title="نسخ الرابط" data-mcopy="' + E(m.id) + '">' + I('copy') + '</button><a class="btn sm" title="فتح" href="' + viewUrl(m.id) + '" target="_blank" rel="noopener">' + I('eye') + '</a>' +
            '<button class="btn sm bad" title="حذف" data-mdel="' + m.row + '" data-id="' + E(m.id) + '">' + I('trash') + '</button></div></div>';
        }).join('') : '<div class="empty" style="grid-column:1/-1">' + I('film') + '<p>المكتبة فاضية. ارفع أول مقطع.</p></div>') + '</div>';
      document.getElementById('mFiles').onchange = function () { uploadMedia(Array.prototype.slice.call(this.files)); this.value = ''; };
      el.querySelectorAll('[data-mcopy]').forEach(function (b) { b.onclick = function () { TH.copy(viewUrl(b.dataset.mcopy)); }; });
      el.querySelectorAll('[data-mdel]').forEach(function (b) {
        b.onclick = function () {
          if (!confirm('حذف الملف من المكتبة؟ ينتقل لسلة المهملات في درايف ويمكن استرجاعه خلال 30 يومًا.')) return;
          call(b, 'adminTrashMedia', Number(b.dataset.mdel), b.dataset.id).then(function (m) { D.media = m; render(); TH.toast('نُقل الملف للمهملات'); });
        };
      });
    }
    function uploadMedia(files) {
      var q = document.getElementById('upq'), prog = document.getElementById('mProg').value, note = document.getElementById('mNote').value;
      var chain = Promise.resolve();
      files.forEach(function (file, n) {
        var row = document.createElement('div'); row.className = 'it';
        row.innerHTML = '<div><b>' + E(file.name) + '</b> <span class="muted">' + TH.size(file.size) + '</span></div><div class="bar"><i></i></div>';
        q.appendChild(row);
        chain = chain.then(function () {
          return TH.probe(file).then(function (meta) {
            return TH.upload(file, 'media', KEY, function (p) { row.querySelector('i').style.width = Math.round(p * 100) + '%'; }).then(function (f) {
              f.dur = meta.dur || 0;
              return TH.run('adminAddMedia', KEY, f, prog, note);
            });
          }).then(function (m) { D.media = m; row.querySelector('i').style.background = 'var(--ok)'; }, function (e) { row.innerHTML += '<div class="small" style="color:var(--bad);grid-column:1/-1">' + E(e.message) + '</div>'; });
        });
      });
      chain.then(function () { TH.toast('اكتمل الرفع'); render(); setTab('media', true); });
    }

    // ===================== دليل نشر إنستغرام =====================
    function renderGuide() {
      var st = TH.star().replace('<svg', '<svg width="16" height="16"');
      document.getElementById('p-guide').innerHTML = '<div class="card" style="margin-top:0">' +
        '<h2 class="sec-title">' + st + 'كيف ينشر النظام في إنستغرام</h2>' +
        '<p>النظام ينشر بالواجهة الرسمية لإنستغرام (Instagram Graph API)، وهي نفس الطريقة التي تستخدمها Metricool وغيرها. كل منشور يمر بثلاث خطوات:</p>' +
        '<div class="flow"><div><span class="n">1</span><b>إنشاء حاوية</b>نرسل لإنستغرام رابط الصورة أو المقطع مع النص، فيعطينا رقم «حاوية».</div>' +
        '<div><span class="n">2</span><b>انتظار المعالجة</b>إنستغرام يحمّل الملف ويعالجه. الصور فورية، والمقاطع تاخذ من ثوانٍ إلى دقائق. نتحقق من الحالة حتى تصير FINISHED.</div>' +
        '<div><span class="n">3</span><b>النشر</b>نطلب نشر الحاوية، فيظهر المنشور في الحساب، ونحفظ رابطه في الطلب.</div></div>' +
        '<h3>' + st + 'أنواع المنشورات</h3><table class="t"><tr><th>النوع</th><th>متى يستخدمه النظام</th><th>الطريقة</th></tr>' +
        '<tr><td>صورة</td><td>طلب فيه صورة واحدة</td><td>حاوية بـ <code>image_url</code> ثم نشر</td></tr>' +
        '<tr><td>ريلز</td><td>طلب فيه مقطع واحد (مثل مقاطع البرامج من المكتبة)</td><td>حاوية <code>media_type=REELS</code> مع المشاركة في الشبكة، ثم انتظار المعالجة، ثم نشر</td></tr>' +
        '<tr><td>كاروسيل</td><td>طلب فيه أكثر من ملف (حتى 10 حسب اللوائح)</td><td>حاوية لكل عنصر، ثم حاوية CAROUSEL تجمعها، ثم نشر. يُحسب منشورًا واحدًا</td></tr></table>' +
        '<h3>' + st + 'مواصفات المقاطع</h3><table class="t"><tr><th>المواصفة</th><th>إنستغرام</th><th>قالب مونتاج ثروة</th></tr>' +
        '<tr><td>الصيغة</td><td>MP4 بترميز H.264 وصوت AAC</td><td>H.264 MP4 ✓</td></tr><tr><td>المقاس</td><td>9:16 (1080×1920)</td><td>1080×1920 ✓</td></tr>' +
        '<tr><td>المدة</td><td>حدود الريلز أطول بكثير مما نحتاجه</td><td>45 ثانية كحد أقصى ✓</td></tr>' +
        '<tr><td>الحجم</td><td>النظام يرفع حتى 48 م.ب عبر الرفع المباشر</td><td>الحد 30 م.ب ✓</td></tr></table>' +
        '<p class="small muted">يعني مقاطع البرامج بقالب المونتاج المعتمد جاهزة للنشر الآلي كما هي.</p>' +
        '<h3>' + st + 'شروط مهمة</h3><ul>' +
        '<li><b>الصور JPEG فقط:</b> النظام يحوّل PNG وغيرها إلى JPEG تلقائيًا قبل النشر.</li>' +
        '<li><b>رابط عام:</b> إنستغرام لازم يقدر يحمّل الملف، فالنظام يسوي نسخة عامة مؤقتة في مجلد «نسخ النشر»، ويرسلها للمهملات بعد النشر.</li>' +
        '<li><b>حد النشر:</b> 100 منشور عبر الواجهة كل 24 ساعة، وهذا أكثر بكثير من احتياجنا.</li>' +
        '<li><b>نسبة الصور:</b> من 4:5 إلى 1.91:1. المعتمد في اللوائح 4:5 للمنشورات و3:4 لإعلانات البرامج.</li>' +
        '<li><b>الكاروسيل:</b> كل الصور تنقص على نسبة الصورة الأولى، فخلها كلها بنفس المقاس.</li>' +
        '<li><b>الرمز:</b> صالح 60 يومًا، والنظام يجدده أسبوعيًا. لو انتهى يظهر خطأ في «المشاكل».</li></ul>' +
        '<h3>' + st + 'ترتيب الأعمدة الثلاثة في الشبكة</h3><p>اللوائح تطلب نشر إعلان البرنامج بالترتيب: <b>المقطع أولًا، ثم الإعلان، ثم منشور الشعار</b>. النظام ينشر الطلبات حسب موعدها، فسجّلها كثلاثة طلبات بمواعيد متتالية (مثلًا 6:00 ثم 6:05 ثم 6:10)، أو أرفقها بنفس الدورة وانشرها بزر «انشر الآن» بالترتيب.</p>' +
        '<h3>' + st + 'أشهر الأخطاء وحلولها</h3><table class="t"><tr><th>الخطأ</th><th>السبب</th><th>الحل</th></tr>' +
        '<tr><td>190</td><td>الرمز منتهي أو غير صالح</td><td>ولّد رمزًا جديدًا والصقه في «المنصات»</td></tr>' +
        '<tr><td>9 / حد النشر</td><td>تجاوز الحد اليومي</td><td>النظام يعيد المحاولة في الدورة القادمة</td></tr>' +
        '<tr><td>2207026</td><td>صيغة المقطع غير مدعومة</td><td>صدّر المقطع MP4 بترميز H.264 وصوت AAC</td></tr>' +
        '<tr><td>36003 / 2207009</td><td>نسبة الأبعاد غير مقبولة</td><td>عدّل المقاس إلى 4:5 أو 9:16</td></tr>' +
        '<tr><td>9004 / 2207052</td><td>إنستغرام ما قدر يحمّل الملف</td><td>تأكد أن الملف موجود في درايف وصيغته صحيحة، ثم «انشر الآن»</td></tr>' +
        '<tr><td>10 / 200</td><td>الصلاحية ناقصة</td><td>عند توليد الرمز وافق على صلاحية النشر</td></tr></table>' +
        '<p class="small muted">كل محاولة فاشلة تنعاد تلقائيًا حتى 3 مرات، وتنسجل في «المشاكل».</p></div>';
    }

    // ===================== الروابط والإعدادات =====================
    function renderSettings() {
      var L = D.links;
      function lnk(label, url, warn) {
        return '<label class="f">' + label + '</label><div class="lnk"><input class="in" readonly value="' + E(url) + '"><button class="btn sm" data-copy="' + E(url) + '">' + I('copy') + 'نسخ</button><a class="btn sm ghost" href="' + E(url) + '" target="_blank" rel="noopener">' + I('eye') + 'فتح</a></div>' + (warn ? '<div class="hint" style="margin-top:-4px;margin-bottom:10px">' + warn + '</div>' : '');
      }
      document.getElementById('p-settings').innerHTML = '<div class="grid2"><div class="pcard"><h3>الروابط</h3>' +
        lnk('رابط طلبات النشر — للبرامج والمشرفين', L.form, 'هذا الرابط تعطيه لبسام وتواق وغيرهم. يفتح بدون تسجيل دخول.') +
        lnk('رابط لوحة التحكم — لك فقط', L.admin, '<b style="color:var(--bad)">لا ترسله لأحد:</b> أي شخص معه هذا الرابط يقدر يشوف الطلبات وأرقام الجوالات ويعتمدها.') +
        lnk('قاعدة البيانات (Google Sheet)', L.sheet) + lnk('مجلد المنصة في درايف', L.folder) + '</div>' +
        '<div class="pcard"><h3>ملفات لوائح النشر (PDF)</h3><p class="muted small" style="margin-top:0">تظهر هذه الملفات أعلى صفحة طلبات النشر. ارفع النسخة المعتمدة متى ما تحدّثت.</p><div id="polList">' + polHtml(D.policyFiles) + '</div>' +
        '<div class="actions"><label class="btn primary sm">' + I('upload') + 'رفع ملف PDF<input type="file" id="polUp" accept="application/pdf,.pdf" hidden></label></div><div class="bar hidden" id="polBar" style="margin-top:10px"><i></i></div></div>' +
        '<div class="pcard"><h3>دورة النشر الآلي</h3><ul class="steps" style="padding-right:18px"><li>تعمل كل 12 ساعة على خوادم Google، حتى لو كل الأجهزة مطفية.</li><li>تنشر الطلبات <b>المعتمدة</b> التي حان موعدها فقط.</li>' +
        '<li>الطلب «المقبول» آليًا ينتظر موعده وينشر مباشرة بدون تدخل منك. لو تبي تعتمد كل طلب بنفسك، غيّر «طريقة النشر» من تبويب «المنصات المرتبطة».</li><li>آخر دورة: ' + E(D.lastRun ? TH.date(D.lastRun) : '—') + '</li></ul>' +
        '<div class="actions"><button class="btn accent" id="runNow2">' + I('refresh') + 'شغّل دورة النشر الآن</button></div></div></div>';
      document.querySelectorAll('[data-copy]').forEach(function (b) { b.onclick = function () { TH.copy(b.dataset.copy); }; });
      document.getElementById('runNow2').onclick = runNow;
      bindPol();
      document.getElementById('polUp').onchange = function () {
        var f = this.files[0]; this.value = ''; if (!f) return;
        var bar = document.getElementById('polBar'); bar.classList.remove('hidden');
        TH.upload(f, 'policy', KEY, function (p) { bar.querySelector('i').style.width = Math.round(p * 100) + '%'; })
          .then(function () { return TH.run('adminListPolicy', KEY); })
          .then(function (l) { D.policyFiles = l; document.getElementById('polList').innerHTML = polHtml(l); bindPol(); bar.classList.add('hidden'); TH.toast('رُفع الملف وظهر في صفحة الطلبات'); })
          .catch(function (e) { bar.classList.add('hidden'); TH.toast(e.message, true); });
      };
    }
    function polHtml(l) {
      return l.length ? l.map(function (f) {
        return '<div class="plat-res"><div class="hd"><a href="' + f.url + '" target="_blank" rel="noopener">' + I('pdf').replace('<svg', '<svg width="16" height="16" style="vertical-align:-3px"') + ' ' + E(f.name) + '</a><button class="btn sm bad" data-pdel="' + E(f.id) + '">' + I('trash') + '</button></div></div>';
      }).join('') : '<div class="note or">' + I('alert') + '<div>لم تُرفع ملفات اللوائح بعد.</div></div>';
    }
    function bindPol() {
      document.querySelectorAll('[data-pdel]').forEach(function (b) {
        b.onclick = function () {
          if (!confirm('حذف هذا الملف من صفحة الطلبات؟')) return;
          call(b, 'adminTrashPolicyFile', b.dataset.pdel).then(function (l) { D.policyFiles = l; document.getElementById('polList').innerHTML = polHtml(l); bindPol(); });
        };
      });
    }

    document.getElementById('hero').innerHTML = heroHtml();
    document.getElementById('runNow').onclick = runNow;
    load();
  </script>
</body>
</html>
